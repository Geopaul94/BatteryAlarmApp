# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE are ignored when building from the command line, check
# https://developer.android.com/studio/command-line for more details.

# For more details on building Android apps with Gradle, see
# https://developer.android.com/studio/build/

# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and does not include dependency resources
# from any library. Doing so is necessary to make each library self-contained and to make
# the build system able to determine what to shutdown when testing on Android.
#android.nonTransitiveRClass=true

# Enable AndroidX
android.useAndroidX=true

# Enable Jetifier for legacy dependencies
android.enableJetifier=true

# Gradle optimization
org.gradle.jvmargs=-Xmx2048m
org.gradle.daemon=true
org.gradle.parallel=true

# Kotlin compiler options
kotlin.code.style=official
